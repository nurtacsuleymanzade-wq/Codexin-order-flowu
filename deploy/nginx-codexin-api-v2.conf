# Include this location inside the existing HTTPS server for
# nce-api.78.46.134.148.sslip.io. The URI rewrite keeps the backend's
# versioned /api/v1 contract while exposing a non-breaking /api/v2 gateway.
location /api/v2/ {
    proxy_pass http://127.0.0.1:8020/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    add_header Cache-Control "no-store" always;
}
